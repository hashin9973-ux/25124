name: Rust validation

on:
  push:
    branches:
      - main
      - foundation/physics-first-core
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Format, check, test, and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install stable Rust with validation tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Bevy Linux development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            g++ pkg-config libx11-dev libasound2-dev libudev-dev \
            libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2.9.3

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Type-check all targets
        run: cargo check --locked --all-targets

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  windows-portable-package:
    name: Build and verify Windows portable package
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build portable package
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Verify portable package layout and world catalog
        shell: pwsh
        run: |
          $root = (Resolve-Path "./dist/physics_sandbox").Path
          $requiredFiles = @(
            "physics_sandbox.exe",
            "data/engine.json",
            "data/materials.json",
            "data/components.json",
            "worlds/catalog.json",
            "worlds/sandbox/world.json",
            "worlds/character_studio/world.json",
            "worlds/character_studio/data/editor/workspace.json",
            "worlds/character_studio/data/editor/tools.json",
            "worlds/character_studio/data/editor/modeling.json",
            "worlds/character_studio/data/species/index.json",
            "worlds/character_studio/data/actions/index.json"
          )
          foreach ($path in $requiredFiles) {
            $candidate = Join-Path $root $path
            if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) {
              throw "Portable package is missing required file: $path"
            }
          }

          $requiredDirectories = @(
            "assets",
            "mods",
            "worlds/sandbox/outputs",
            "worlds/character_studio/assets",
            "worlds/character_studio/outputs",
            "worlds/character_studio/outputs/models"
          )
          foreach ($path in $requiredDirectories) {
            $candidate = Join-Path $root $path
            if (-not (Test-Path -LiteralPath $candidate -PathType Container)) {
              throw "Portable package is missing required directory: $path"
            }
          }

          $catalog = Get-Content -LiteralPath (Join-Path $root "worlds/catalog.json") -Raw | ConvertFrom-Json
          if ($catalog.schema_version -ne 1) {
            throw "Unsupported world catalog schema in portable package"
          }
          $worldIds = @($catalog.worlds | ForEach-Object { $_.id })
          foreach ($requiredId in @("sandbox", "character_studio")) {
            if ($worldIds -notcontains $requiredId) {
              throw "Portable world catalog is missing required world: $requiredId"
            }
          }

          $studioManifest = Get-Content -LiteralPath (Join-Path $root "worlds/character_studio/world.json") -Raw | ConvertFrom-Json
          if (@($studioManifest.objects).Count -ne 0) {
            throw "Character Studio must start with an empty world composition"
          }

          $studioWorkspace = Get-Content -LiteralPath (Join-Path $root "worlds/character_studio/data/editor/workspace.json") -Raw | ConvertFrom-Json
          $modelingSettingsPath = Join-Path $root ("worlds/character_studio/data/" + $studioWorkspace.modeling_settings)
          if (-not (Test-Path -LiteralPath $modelingSettingsPath -PathType Leaf)) {
            throw "Character Studio modeling settings path does not exist: $($studioWorkspace.modeling_settings)"
          }
          $modelingSettings = Get-Content -LiteralPath $modelingSettingsPath -Raw | ConvertFrom-Json
          if ($modelingSettings.schema_version -ne 1) {
            throw "Unsupported Character Studio modeling settings schema"
          }
          $undoHistorySetting = $modelingSettings.edit_history.maximum_undo_steps
          if ($null -eq $undoHistorySetting) {
            $undoHistoryLimit = 64
          } else {
            if ($undoHistorySetting -isnot [int] -and $undoHistorySetting -isnot [long]) {
              throw "Character Studio undo history must be an integer"
            }
            $undoHistoryLimit = [int]$undoHistorySetting
          }
          if ($undoHistoryLimit -lt 0 -or $undoHistoryLimit -gt 256) {
            throw "Character Studio undo history must be between 0 and 256 steps"
          }
          $planeNormal = @($modelingSettings.construction_plane.normal_world | ForEach-Object { [double]$_ })
          $normalSquared = 0.0
          $planeNormalValid = $planeNormal.Count -eq 3
          foreach ($component in $planeNormal) {
            if (-not [double]::IsFinite($component)) {
              $planeNormalValid = $false
            }
            $normalSquared += $component * $component
          }
          if (-not $planeNormalValid) {
            throw "Character Studio construction plane normal must contain three finite components"
          }
          $normalLength = [Math]::Sqrt($normalSquared)
          if (-not [double]::IsFinite($normalLength) -or $normalLength -le 1.0e-12) {
            throw "Character Studio construction plane normal must be non-zero"
          }
          $gridSpacing = [double]$modelingSettings.construction_plane.grid_spacing_m
          $gridExtent = [double]$modelingSettings.construction_plane.grid_extent_m
          if (
            -not [double]::IsFinite($gridSpacing) -or $gridSpacing -le 0 -or
            -not [double]::IsFinite($gridExtent) -or $gridExtent -le 0 -or
            ($gridExtent / $gridSpacing) -gt 100
          ) {
            throw "Character Studio construction plane grid spacing/extent must be positive and bounded to 100 intervals per side"
          }

          foreach ($world in $catalog.worlds) {
            foreach ($field in @("manifest", "data", "assets", "outputs")) {
              $relative = [string]$world.$field
              $parts = $relative -split "/"
              if (
                [string]::IsNullOrWhiteSpace($relative) -or
                [System.IO.Path]::IsPathRooted($relative) -or
                $relative.IndexOf([char]92) -ge 0 -or
                $parts -contains "." -or
                $parts -contains ".." -or
                $parts -contains ""
              ) {
                throw "World '$($world.id)' has an unsafe '$field' path: $relative"
              }

              $candidate = Join-Path $root $relative
              $isManifest = $field -eq "manifest"
              $pathType = if ($isManifest) { "Leaf" } else { "Container" }
              if (-not (Test-Path -LiteralPath $candidate -PathType $pathType)) {
                throw "World '$($world.id)' catalog path does not exist: $relative"
              }
            }
          }

      - name: Archive portable Windows package
        shell: pwsh
        run: |
          $archive = "./dist/physics_sandbox-windows-x86_64.zip"
          if (Test-Path $archive) {
            Remove-Item $archive -Force
          }
          Compress-Archive -Path "./dist/physics_sandbox" -DestinationPath $archive -CompressionLevel Optimal
          if (-not (Test-Path $archive -PathType Leaf)) {
            throw "Portable package archive was not created: $archive"
          }

      - name: Upload portable Windows build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: physics_sandbox-windows-x86_64
          path: dist/physics_sandbox-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 30
