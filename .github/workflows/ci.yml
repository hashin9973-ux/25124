name: Rust validation

on:
  push:
    branches:
      - main
      - foundation/physics-first-core
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Format, check, test, and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install stable Rust with validation tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Bevy Linux development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            g++ pkg-config libx11-dev libasound2-dev libudev-dev \
            libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2.9.3

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Type-check all targets
        run: cargo check --locked --all-targets

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  windows-portable-package:
    name: Build and verify Windows portable package
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build portable package
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Verify portable package layout
        shell: pwsh
        run: |
          $root = "./dist/physics_sandbox"
          foreach ($path in @("physics_sandbox.exe", "data/engine.json", "data/materials.json", "data/components.json", "assets", "mods", "worlds/sandbox/world.json")) {
            if (-not (Test-Path (Join-Path $root $path))) {
              throw "Portable package is missing: $path"
            }
          }

      - name: Archive portable Windows package
        shell: pwsh
        run: |
          $archive = "./dist/physics_sandbox-windows-x86_64.zip"
          if (Test-Path $archive) {
            Remove-Item $archive -Force
          }
          Compress-Archive -Path "./dist/physics_sandbox" -DestinationPath $archive -CompressionLevel Optimal
          if (-not (Test-Path $archive -PathType Leaf)) {
            throw "Portable package archive was not created: $archive"
          }

      - name: Upload portable Windows build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: physics_sandbox-windows-x86_64
          path: dist/physics_sandbox-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 30
