[package]
name = "physics_sandbox"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
avian3d = "0.8.0"
bevy = { version = "0.20.1", default-features = false, features = [
    "default_app",
    "std",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "webgl2",
    "x11",
    "wayland",
    "custom_cursor",
    "3d_bevy_render",
    "scene",
    "bevy_sprite",
    "bevy_sprite_render",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
